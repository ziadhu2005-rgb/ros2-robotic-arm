# ros_gz_bridge topics between ROS 2 and Gazebo

# Simulation clock (Gazebo -> ROS)
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "ignition.msgs.Clock"
  direction: GZ_TO_ROS

# Joint angles from the simulation, so RViz2 follows Gazebo (Gazebo -> ROS)
- ros_topic_name: "/joint_states"
  gz_topic_name: "/arm/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "ignition.msgs.Model"
  direction: GZ_TO_ROS

# Position commands for each joint (ROS -> Gazebo)
- ros_topic_name: "/arm/joint1/cmd_pos"
  gz_topic_name: "/arm/joint1/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm/joint2/cmd_pos"
  gz_topic_name: "/arm/joint2/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm/joint3/cmd_pos"
  gz_topic_name: "/arm/joint3/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/arm/joint4/cmd_pos"
  gz_topic_name: "/arm/joint4/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ
